<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/stylesheet.css">
    <link rel="stylesheet" href="/navBarSheet.css">
    <link rel="stylesheet" href="/Mothership/mothership_style.css">
    <link rel="stylesheet" href="/Mothership/crt.css">

    <!-- JQuery, basically only used to import the NavBar from a file, allowing me to edit the NavBar in all files at once -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function () {
            $("#includedContent").load("/Mothership/motherBarReference.html");
        });
    </script>


    <!-- Fonts -->
    <link href="https://fonts.cdnfonts.com/css/luminari" rel="stylesheet">

    <title>ANVOLLA</title>
</head>

<body class="crt" name="crt_filter">
    <div class="scanlines" name="scan_filter">
        <div class="jpg">
            <!-- Navbar, imported using JQuery above -->
            <div id="includedContent"></div>
            <!-- Line break into breadtext-->
            <br>
            <div class="headText">
                NAME
            </div>
            <br>
            <div class="border">
                <!-- info sheet -->
                <div class="breadText" style="display:flex; flex-direction: row;">
                    <ul>
                        <li><strong>Surface:</strong>Terrestrial</li> 
                        <li><strong>Size:</strong>Earth-Sized Planet</li>
                        <li><strong>Atmosphere:</strong>Terraformed</li>
                        
                    </ul>
                    <ul>
                        <li><strong>Climate:</strong>Arid</li> 
                        <li><strong>Population:</strong>Millions</li>
                        <li><strong>Controlled By:</strong>Corporation (Seer Makrosystem)</li>
                    </ul>
                </div>
                <!-- blurb -->
                <div class="breadText">
                    <span class="textHighlight">Name</span> is a blablabla
                </div>



            </div>
            <br>
            <br>
        </div>
    </div>
</body>

</html>
