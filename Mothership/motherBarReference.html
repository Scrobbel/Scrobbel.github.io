<!-- We use a some scripts to highlight the current site we're on -->
<script>
    /* This gets for all the non-dropdown elements */
    document.querySelectorAll(".topNav a").forEach((link) => {
        if (link.href === window.location.href) {
            link.classList.add("active");
            link.setAttribute("aria-current", "page");
        }
    });
    
    /* This one is for dropdowns under the buttons */
    document.querySelectorAll(".dropdown a").forEach((link) => {
        if (link.href === window.location.href) {
            link.classList.add("active");
            link.setAttribute("aria-current", "page");
        }
    });

    /* and a script to disable the CRT filter */
    function remove_crt(){
        var crt = document.getElementsByName('crt_filter')
        var scanlines = document.getElementsByName('scan_filter');
        for(var i = 0; i<crt.length; i++){
            if(crt[i].className == 'crt'){
                crt[i].className = 'none'
            }
            else{
                crt[i].className = 'crt'
            }
            
        }
        for(var i = 0; i<scanlines.length; i++){
            if(scanlines[i].className == 'scanlines'){
                scanlines[i].className = 'none'
            }
            else{
                scanlines[i].className = 'scanlines'
            }
        }
    }
</script>
