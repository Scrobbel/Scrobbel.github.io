<!-- We use a some scripts to highlight the current site we're on -->
<script>
    /* This gets for all the non-dropdown elements */
    document.querySelectorAll(".topNav a").forEach((link) => {
        if (link.href === window.location.href) {
            link.classList.add("active");
            link.setAttribute("aria-current", "page");
        }
    });
    
    /* This one is for dropdowns under the buttons */
    document.querySelectorAll(".dropdown a").forEach((link) => {
        if (link.href === window.location.href) {
            link.classList.add("active");
            link.setAttribute("aria-current", "page");
        }
    });

    /* and a script to disable the CRT filter */
    function remove_crt(el){
        if (el == document.body){
            console.log("reached 1")
            el.removeAttribute('crt')
            console.log("reached 2")
            if(el.childNodes[0].nodeType == 1)
                var child = el.childNodes[0]
                remove_crt(child)
            }
        else{
            console.log("reached 3")
            el.removeAttribute('scanlines')
            console.log("reached 4")
            }
    }
</script>
